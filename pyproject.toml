[project]
name = "slime-cairn"
version = "0.0.41"
description = "Persistent multi-project, Cairn-inspired exploration runtime"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agents", "automation", "cairn", "orchestration", "physarum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
slime = "slime_cairn.cli:main"
slime-cairn-api = "slime_cairn.server.api:main"
slime-cairn-service = "slime_cairn.dispatcher.main:main"

[build-system]
requires = [
    "hatchling==1.32.0",
    "trove-classifiers==2026.6.1.19",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slime_cairn"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
