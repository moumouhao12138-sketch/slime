      function graphColor(node) {
        if (node.kind === "origin") return { fill: "#0f766e", stroke: "#075f55" };
        if (node.kind === "goal") return { fill: "#be123c", stroke: "#9f1239" };
        if (node.kind === "hypothesis") return { fill: "#ece5ff", stroke: "#9270d2" };
        if (node.kind === "intent") {
          const status = intentDisplayStatus(node);
          if (status === "running") return { fill: "#f7c66a", stroke: "#b45309" };
          if (status === "failed") return { fill: "#fbd1dc", stroke: "#be123c" };
          if (status === "retry_wait") return { fill: "#dce8ff", stroke: "#2563eb" };
          if (status === "pending") return { fill: "#e8edef", stroke: "#87989c" };
          return { fill: "#fde3ad", stroke: "#b45309" };
        }
        return { fill: "#2563eb", stroke: "#1d4ed8" };
      }

      function graphLayout(nodes, edges) {
        const levels = new Map();
        const byNodeId = new Map(nodes.map((node) => [node.id, node]));
        const maxDepth = 6;
        nodes.forEach((node) => levels.set(node.id, node.kind === "origin" ? 0 : 1));
        const flowEdges = edges.filter((edge) => !["fact_relation", "hypothesis_support"].includes(edge.kind));
        for (let pass = 0; pass < nodes.length + 2; pass += 1) {
          let changed = false;
          for (const edge of flowEdges) {
            if (!byNodeId.has(edge.source) || !byNodeId.has(edge.target)) continue;
            const next = Math.min(maxDepth, Math.max(levels.get(edge.target) || 0, (levels.get(edge.source) || 0) + 1));
            if (next !== levels.get(edge.target) && byNodeId.get(edge.target).kind !== "origin") {
              levels.set(edge.target, next);
              changed = true;
            }
          }
          if (!changed) break;
        }
        const maxLevel = Math.max(1, ...levels.values());
        const goal = nodes.find((node) => node.kind === "goal");
        if (goal) levels.set(goal.id, Math.min(maxDepth + 1, Math.max(maxLevel + 1, levels.get(goal.id) || 0)));
        const groups = new Map();
        nodes.forEach((node) => {
          const level = levels.get(node.id) || 0;
          if (!groups.has(level)) groups.set(level, []);
          groups.get(level).push(node);
        });
        const positions = new Map();
        const orderedLevels = [...groups.keys()].sort((left, right) => left - right);
        const graphWidth = Math.max(780, 180 + orderedLevels.length * 230);
        let graphHeight = 360;
        for (const level of orderedLevels) {
          const group = groups.get(level);
          group.sort((left, right) => (left.created_at || 0) - (right.created_at || 0));
          const required = 100 + group.length * 118;
          graphHeight = Math.max(graphHeight, required);
          group.forEach((node, index) => {
            const x = 105 + orderedLevels.indexOf(level) * 230;
            const y = 72 + index * 118 + Math.max(0, (graphHeight - required) / 2);
            positions.set(node.id, { x, y });
          });
        }
        return { positions, width: graphWidth, height: graphHeight };
      }

      function nodeDimensions(node) {
        const lines = nodeLabelLines(node.label, node.kind === "intent" ? 25 : 20, 3);
        return { width: node.kind === "intent" ? 178 : 156, height: Math.max(42, 18 + lines.length * 15), lines };
      }

      function edgePath(source, target) {
        const middle = source.x + (target.x - source.x) * 0.5;
        return `M ${source.x} ${source.y} C ${middle} ${source.y}, ${middle} ${target.y}, ${target.x} ${target.y}`;
      }

      function renderGraph() {
        graph.replaceChildren();
        const empty = byId("graph-empty");
        const view = state.view;
        const projection = activeGraph(view);
        if (!view || !projection.nodes.length) {
          empty.textContent = state.selectedProjectId ? "暂无图谱记录" : "选择项目";
          empty.classList.remove("hidden");
          return;
        }
        empty.classList.add("hidden");
        const nodes = enrichedGraphNodes(view);
        const edges = projection.edges;
        const layout = graphLayout(nodes, edges);
        const activeWorkerByIntent = new Map(
          activeWorkers(view)
            .filter((worker) => worker.intentId)
            .map((worker) => [worker.intentId, worker]),
        );
        graph.setAttribute("viewBox", `0 0 ${layout.width} ${layout.height}`);
        graph.setAttribute("preserveAspectRatio", "xMidYMid meet");
        const defs = svgElement("defs");
        const marker = svgElement("marker", { id: "arrow", viewBox: "0 0 10 10", refX: "8", refY: "5", markerWidth: "6", markerHeight: "6", orient: "auto-start-reverse" });
        marker.append(svgElement("path", { d: "M 0 0 L 10 5 L 0 10 z", fill: "#9bb0b4" }));
        defs.append(marker);
        graph.append(defs);
        const byNodeId = new Map(nodes.map((node) => [node.id, node]));
        for (const edge of edges) {
          const source = layout.positions.get(edge.source);
          const target = layout.positions.get(edge.target);
          if (!source || !target) continue;
          const sourceNode = byNodeId.get(edge.source);
          const classes = ["graph-edge", edge.kind];
          if (sourceNode && sourceNode.status === "running") classes.push("running");
          const path = svgElement("path", { d: edgePath(source, target), class: classes.join(" ") });
          const title = svgElement("title");
          title.textContent = edge.relation || edge.kind.replace(/_/g, " ");
          path.append(title);
          graph.append(path);
        }
        for (const node of nodes) {
          const position = layout.positions.get(node.id);
          if (!position) continue;
          const activeWorker = node.kind === "intent" ? activeWorkerByIntent.get(node.entity_id) : null;
          const dimensions = nodeDimensions(node);
          const colors = graphColor(node);
          const status = node.kind === "intent" ? intentDisplayStatus(node) : node.status;
          const group = svgElement("g", { class: `graph-node kind-${node.kind}${status ? ` kind-${status}` : ""}`, tabindex: "0", role: "button", "aria-label": node.label });
          if (node.id === state.selectedNodeId) group.classList.add("selected");
          if (activeWorker) group.classList.add("worker-active");
          const title = svgElement("title");
          title.textContent = activeWorker
            ? `${node.label}\n${activeWorker.phase} running on ${activeWorker.workerName}\nelapsed ${durationLabel(elapsedSeconds(activeWorker.startedAt))}`
            : node.label;
          const rect = svgElement("rect", { x: position.x - dimensions.width / 2, y: position.y - dimensions.height / 2, width: dimensions.width, height: dimensions.height, rx: "7", fill: colors.fill, stroke: colors.stroke });
          group.append(title, rect);
          const text = svgElement("text", { x: position.x, y: position.y - ((dimensions.lines.length - 1) * 7), "text-anchor": "middle" });
          dimensions.lines.forEach((line, index) => {
            const tspan = svgElement("tspan", { x: position.x, dy: index === 0 ? "0" : "15" });
            tspan.textContent = line;
            text.append(tspan);
          });
          group.append(text);
          const select = () => { state.selectedNodeId = node.id; renderGraph(); renderInspector(); };
          group.addEventListener("click", select);
          group.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(); }
          });
          graph.append(group);
        }
      }

      function addDetailLine(parent, key, value) {
        if (value === undefined || value === null || value === "") return;
        const line = element("div", "detail-line");
        line.append(element("div", "detail-key", key), element("div", "detail-value", Array.isArray(value) ? value.join(", ") : String(value)));
        parent.append(line);
      }

      function appendSection(parent, title, content) {
        const section = element("section", "detail-section");
        section.append(element("h3", "", title));
        section.append(content);
        parent.append(section);
      }

      function recordList(records, renderRecord) {
        const list = element("div", "record-list");
        if (!records.length) {
          list.append(element("div", "detail-value", "暂无记录"));
          return list;
        }
        records.forEach((record) => list.append(renderRecord(record)));
        return list;
      }

      function renderInspector() {
        inspectorBody.replaceChildren();
        const view = state.view;
        if (!view) {
          byId("inspector-mode").textContent = "项目";
          inspectorBody.append(element("div", "notice", "等待项目数据"));
          return;
        }
        const selected = enrichedGraphNodes(view).find((node) => node.id === state.selectedNodeId) || null;
        byId("inspector-mode").textContent = selected ? statusLabel(selected.kind) : "项目";
        inspectorBody.append(element("h2", "inspector-title", selected ? selected.label : view.project.name));
        inspectorBody.append(element("p", "inspector-subtitle", selected ? selected.entity_id : view.project.goal));

        if (selected) {
          const details = element("div", "detail-list");
          addDetailLine(details, "类型", statusLabel(selected.kind));
          addDetailLine(details, "状态", selected.status && statusLabel(selected.kind === "intent" ? intentDisplayStatus(selected) : selected.status));
          addDetailLine(details, "置信度", selected.confidence !== undefined ? `${Math.round(selected.confidence * 100)}%` : "");
          addDetailLine(details, "Predicate", selected.predicate);
          addDetailLine(details, "Object", selected.object);
          addDetailLine(details, "Worker", selected.worker);
          addDetailLine(details, "Nutrient", selected.nutrient !== undefined ? Number(selected.nutrient).toFixed(2) : "");
          addDetailLine(details, "Strength", selected.strength !== undefined ? Number(selected.strength).toFixed(2) : "");
          addDetailLine(details, "尝试", selected.attempts);
          if (selected.kind === "intent") {
            addDetailLine(details, "连续失败", selected.failure_streak);
            if (intentRetryWaiting(selected)) {
              addDetailLine(details, "下次重试", formatTime(retryNotBefore(selected)));
              addDetailLine(details, "等待重试", retryDelayLabel(selected));
            }
          }
          addDetailLine(details, "记忆", selected.memory_state);
          addDetailLine(details, "下一步", selected.next_validation);
          addDetailLine(details, "证据", selected.evidence_refs);
          addDetailLine(details, "错误", selected.last_error);
          addDetailLine(details, "创建", formatTime(selected.created_at));
          appendSection(inspectorBody, "节点详情", details);

          const retryable = selected.kind === "intent" && (
            intentRetryWaiting(selected) || selected.status === "failed" || selected.status === "retry_wait"
          );
          if (retryable) {
            const actions = element("div", "intent-actions");
            const retryButton = element("button", "button primary", "立即重试");
            retryButton.id = "retry-intent-button";
            retryButton.type = "button";
            const project = currentProject();
            retryButton.disabled = !project || project.status !== "running";
            retryButton.title = retryButton.disabled ? "项目停止后继续运行即可重试" : "清除退避时间并重新加入调度队列";
            retryButton.addEventListener("click", () => retrySelectedIntent(selected, retryButton));
            actions.append(retryButton);
            appendSection(inspectorBody, "Intent 操作", actions);
          }
        } else {
          const metrics = element("div", "metric-grid");
          const entries = [
            ["Facts", view.summary.fact_count],
            ["Running", (view.summary.intent_status || {}).running || 0],
            ["Evidence", (view.evidence || []).length],
            ["Runs", (view.worker_runs || []).length],
          ];
          entries.forEach(([label, value]) => {
            const metric = element("div", "metric");
            metric.append(element("span", "metric-label", label), element("span", "metric-value", String(value)));
            metrics.append(metric);
          });
          inspectorBody.append(metrics);
          const details = element("div", "detail-list");
          const retryingIntents = view.runtime.retrying_intents || [];
          addDetailLine(details, "目标", view.project.target);
          addDetailLine(details, "Goal", view.project.goal);
          addDetailLine(details, "Dispatcher", view.runtime.dispatcher ? view.runtime.dispatcher.state : "等待");
          addDetailLine(details, "Reason", view.runtime.dispatcher?.status?.reason_running?.worker_name || "-");
          addDetailLine(details, "租约", view.summary.active_lease_count);
          addDetailLine(details, "等待重试", retryingIntents.length);
          if (view.runtime.next_retry_not_before) addDetailLine(details, "最近重试", formatTime(view.runtime.next_retry_not_before));
          const reasonCooldown = Number(view.runtime.dispatcher?.status?.reason_cooldown_remaining || 0);
          const reasonFailure = String(view.runtime.dispatcher?.status?.reason_failure_signature || "").trim();
          if (reasonFailure) addDetailLine(details, "Reason error", reasonFailure.slice(0, 180));
          if (reasonCooldown > 0) addDetailLine(details, "Reason 冷却", `${Math.ceil(reasonCooldown)} 秒后`);
          appendSection(inspectorBody, "项目状态", details);
        }

        const runningWorkers = activeWorkers(view);
        appendSection(inspectorBody, "Active Workers", recordList(runningWorkers, (worker) => {
          const record = element("div", "record");
          const heading = element("div", "record-title");
          const chip = element("span");
          setStatusChip(chip, worker.stale ? "stale" : "running");
          heading.append(element("span", "", `${worker.phase} - ${worker.workerName}`), chip);
          const details = [`elapsed ${durationLabel(elapsedSeconds(worker.startedAt))}`];
          const heartbeatAge = elapsedSeconds(worker.heartbeatAt);
          details.push(heartbeatAge === null ? "heartbeat pending" : `heartbeat ${durationLabel(heartbeatAge)} ago`);
          if (worker.stale) details.push("dispatcher heartbeat stale");
          record.append(heading, element("div", "record-value", details.join(" | ")));
          return record;
        }));

        appendSection(inspectorBody, "最近 Evidence", recordList((view.evidence || []).slice(0, 6), (evidence) => {
          const record = element("div", "record");
          const heading = element("div", "record-title");
          heading.append(element("span", "", evidence.kind), element("span", "", formatTime(evidence.created_at)));
          record.append(heading, element("div", "record-value", shortText(evidence.evidence_ref, 120)));
          return record;
        }));

        appendSection(inspectorBody, "Worker Runs", recordList((view.worker_runs || []).slice(0, 6), (run) => {
          const record = element("div", "record");
          const heading = element("div", "record-title");
          const chip = element("span");
          setStatusChip(chip, run.status);
          heading.append(element("span", "", `${run.mode} · ${run.worker_name || "worker"}`), chip);
          const note = run.errors?.length ? run.errors[run.errors.length - 1] : run.stop_reason;
          record.append(heading, element("div", "record-value", shortText(note || `tools ${run.tool_calls || 0}`, 120)));
          return record;
        }));
      }

      function eventSummary(event) {
        const payload = event.payload || {};
        if (event.kind === "reason.intent_batch_created") {
          const count = Number(payload.fanout_count || (payload.intent_ids || []).length || 0);
          return payload.parallel ? `Reason 创建 ${count} 个并行分支` : `Reason 创建 ${count} 个探索方向`;
        }
        if (event.kind.startsWith("intent.retry")) {
          const details = [];
          if (payload.failure_streak !== undefined) details.push(`连续失败 ${payload.failure_streak}`);
          if (payload.retry_not_before) details.push(`重试于 ${formatTime(payload.retry_not_before)}`);
          if (payload.retry_delay_seconds) details.push(`${Math.ceil(Number(payload.retry_delay_seconds))} 秒后`);
          if (payload.previous_retry_not_before) details.push("已立即重试");
          if (payload.reason) details.push(shortText(payload.reason, 80));
          if (payload.error) details.push(shortText(payload.error, 80));
          return details.length ? details.join(" · ") : "Intent 重试状态更新";
        }
        if (payload.error) return shortText(payload.error, 130);
        if (payload.description) return shortText(payload.description, 130);
        if (payload.object && payload.predicate) return shortText(`${payload.predicate}: ${payload.object}`, 130);
        if (payload.intent_id) return `Intent ${shortText(payload.intent_id, 32)}`;
        if (payload.worker_name) return `${payload.worker_name}${payload.mode ? ` · ${payload.mode}` : ""}`;
        if (payload.path) return shortText(payload.path, 130);
        const values = Object.values(payload).filter((value) => typeof value === "string" || typeof value === "number");
        return values.length ? shortText(values.join(" · "), 130) : "Blackboard 更新";
      }

      function targetForEvent(event) {
        const payload = event.payload || {};
        if (payload.intent_id) return `intent:${payload.intent_id}`;
        if (payload.fact_id) return `fact:${payload.fact_id}`;
        if (event.kind === "fact.created" && payload.id) return `fact:${payload.id}`;
        if (event.kind === "hypothesis.created" && payload.id) return `hypothesis:${payload.id}`;
        if (event.kind === "intent.created" && payload.id) return `intent:${payload.id}`;
        return "";
      }

      function renderTimeline() {
        timelineList.replaceChildren();
        byId("event-count").textContent = `${state.events.length} 条记录`;
        if (!state.events.length) {
          timelineList.append(element("div", "timeline-empty", "暂无活动记录"));
          return;
        }
        [...state.events].reverse().forEach((event) => {
          const row = element("button", "timeline-row");
          row.type = "button";
          row.title = `${event.kind}\n${eventSummary(event)}`;
          row.append(
            element("span", "timeline-time", formatTime(event.created_at)),
            element("span", "timeline-kind", event.kind),
            element("span", "timeline-summary", eventSummary(event)),
          );
          row.addEventListener("click", () => {
            const target = targetForEvent(event);
            if (target && activeGraph(state.view).nodes.some((node) => node.id === target)) {
              state.selectedNodeId = target;
              renderGraph();
              renderInspector();
            }
          });
          timelineList.append(row);
        });
      }

      function render() {
        renderProjectList();
        renderProjectHeader();
        renderReadableView();
        renderGraph();
        renderInspector();
        renderTimeline();
        applyViewMode();
      }

      async function setProjectStatus(status) {
        const project = currentProject();
        if (!project) return;
        try {
          await request(`/projects/${encodeURIComponent(project.id)}/status`, {
            method: "PUT",
            body: JSON.stringify({ status }),
          });
          showToast(status === "stopped" ? "项目已停止" : "项目已继续");
          await refresh(false);
        } catch (error) {
          showToast(`状态更新失败: ${error.message}`, true);
        }
      }

      async function retrySelectedIntent(intent, button) {
        const project = currentProject();
        if (!project || !intent || !intent.entity_id || project.status !== "running") return;
        button.disabled = true;
        try {
          await request(`/projects/${encodeURIComponent(project.id)}/intents/${encodeURIComponent(intent.entity_id)}/retry`, {
            method: "POST",
          });
          showToast("Intent 已重新加入调度队列");
          await refresh(true);
        } catch (error) {
          showToast(`Intent 重试失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      function newProjectHints() {
        return [...byId("new-project-hint-list").querySelectorAll(".new-project-hint-input")]
          .map((input) => input.value.trim())
          .filter(Boolean)
          .map((content) => ({ content, creator: "ui" }));
      }

      function addNewProjectHint(content = "") {
        const row = element("div", "new-project-hint-row");
        const input = document.createElement("textarea");
        input.className = "new-project-hint-input";
        input.value = content;
        input.setAttribute("aria-label", "初始 Hint");
        const remove = element("button", "button critical hint-remove-button", "移除");
        remove.type = "button";
        remove.title = "移除此 Hint";
        remove.addEventListener("click", () => row.remove());
        row.append(input, remove);
        byId("new-project-hint-list").append(row);
        return input;
      }

      function updateNewProjectConfirmState() {
        const ready = Boolean(
          byId("new-project-name").value.trim()
          && byId("new-project-target").value.trim()
          && byId("new-project-goal").value.trim(),
        );
        byId("new-project-confirm").disabled = state.creatingProject || !ready;
        byId("new-project-add-hint").disabled = state.creatingProject;
      }

      function openNewProjectDialog() {
        if (state.creatingProject) return;
        byId("new-project-name").value = "";
        byId("new-project-target").value = "";
        byId("new-project-goal").value = "";
        byId("new-project-growth").checked = true;
        byId("new-project-hint-list").replaceChildren();
        updateNewProjectConfirmState();
        byId("new-project-dialog-layer").classList.remove("hidden");
        byId("new-project-name").focus();
      }

      function closeNewProjectDialog() {
        if (state.creatingProject) return;
        byId("new-project-dialog-layer").classList.add("hidden");
      }

      async function createNewProject() {
        const name = byId("new-project-name").value.trim();
        const target = byId("new-project-target").value.trim();
        const goal = byId("new-project-goal").value.trim();
        if (!name || !target || !goal || state.creatingProject) {
          updateNewProjectConfirmState();
          return;
        }

        state.creatingProject = true;
        updateNewProjectConfirmState();
        try {
          const created = await request("/projects", {
            method: "POST",
            body: JSON.stringify({
              name,
              target,
              title: name,
              origin: target,
              goal,
              allowed_targets: [target],
              start_mode: document.querySelector('input[name="new-project-start-mode"]:checked')?.value || "growth",
              bootstrap_enabled: byId("new-project-direct").checked || byId("new-project-hybrid").checked,
              hints: newProjectHints(),
            }),
          });
          const project = created.project;
          if (!project || !project.id) throw new Error("项目创建响应缺少项目数据");
          state.selectedProjectId = project.id;
          state.selectedNodeId = "";
          state.view = null;
          state.events = [];
          state.eventCursor = 0;
          state.creatingProject = false;
          closeNewProjectDialog();
          showToast(`项目“${project.name}”已创建`);
          await refresh(true);
        } catch (error) {
          showToast(`创建项目失败: ${error.message}`, true);
        } finally {
          state.creatingProject = false;
          if (!byId("new-project-dialog-layer").classList.contains("hidden")) updateNewProjectConfirmState();
        }
      }

      function openHintDialog() {
        const project = currentProject();
        if (!project) return;
        byId("hint-project-name").textContent = project.name;
        byId("hint-content").value = "";
        updateHintConfirmState();
        byId("hint-dialog-layer").classList.remove("hidden");
        byId("hint-content").focus();
      }

      function closeHintDialog() {
        byId("hint-dialog-layer").classList.add("hidden");
      }

      function updateHintConfirmState() {
        byId("hint-confirm").disabled = !byId("hint-content").value.trim();
      }

      async function addHint() {

            method: "POST",

          });

          showToast(`Hint 添加失败: ${error.message}`, true);

          confirm.disabled = false;

        const project = currentProject();
        if (!project) return;
        byId("reopen-project-name").textContent = project.name;
        byId("reopen-description").value = "";
        updateReopenConfirmState();
        byId("reopen-dialog-layer").classList.remove("hidden");
        byId("reopen-description").focus();
      }

      function closeReopenDialog() {
        byId("reopen-dialog-layer").classList.add("hidden");
      }

      function updateReopenConfirmState() {
        byId("reopen-confirm").disabled = !byId("reopen-description").value.trim();

        if (!project || !description) {
          updateReopenConfirmState();
          return;

            method: "POST",

          });
          closeReopenDialog();
          showToast("项目已重新打开");
          await refresh(true);

          showToast(`重新打开失败: ${error.message}`, true);

      function openDeleteDialog() {
        const project = currentProject();
        if (!project) return;
        state.deleteProject = { id: project.id, name: project.name };
        byId("delete-project-name").textContent = project.name;
        byId("delete-project-confirmation").value = "";
        updateDeleteConfirmState();
        byId("delete-dialog-layer").classList.remove("hidden");
        byId("delete-project-confirmation").focus();
      }

      function closeDeleteDialog() {
        byId("delete-dialog-layer").classList.add("hidden");
        state.deleteProject = null;
      }

      function updateDeleteConfirmState() {
        const confirmation = byId("delete-project-confirmation").value;
        const project = state.deleteProject;
        byId("delete-confirm").disabled = !project || confirmation !== project.name;
      }

      async function deleteProject() {
        const project = state.deleteProject;
        if (!project || byId("delete-project-confirmation").value !== project.name) {
          updateDeleteConfirmState();
          return;
        }
        const confirm = byId("delete-confirm");
        confirm.disabled = true;
        try {
          await request(`/projects/${encodeURIComponent(project.id)}`, { method: "DELETE" });
          closeDeleteDialog();
          state.selectedProjectId = "";
          state.selectedNodeId = "";
          state.view = null;
          state.events = [];
          state.eventCursor = 0;
          showToast(`项目“${project.name}”正在删除和清理`);
          await refresh(true);
        } catch (error) {
          showToast(`删除项目失败: ${error.message}`, true);
        } finally {
          if (!byId("delete-dialog-layer").classList.contains("hidden")) updateDeleteConfirmState();
        }
      }

      function openBulkDeleteDialog() {
        const projectIds = state.projects
          .filter((project) => state.selectedProjectIds.has(project.id))
          .map((project) => project.id);
        if (!projectIds.length) {
          updateBulkDeleteControls();
          return;
        }
        state.bulkDeleteProjectIds = projectIds;
        byId("bulk-delete-count").textContent = projectIds.length;
        byId("bulk-delete-confirmation").checked = false;
        updateBulkDeleteConfirmState();
        byId("bulk-delete-dialog-layer").classList.remove("hidden");
        byId("bulk-delete-confirmation").focus();
      }

      function closeBulkDeleteDialog() {
        byId("bulk-delete-dialog-layer").classList.add("hidden");
        state.bulkDeleteProjectIds = [];
        byId("bulk-delete-confirmation").checked = false;
      }

      function updateBulkDeleteConfirmState() {
        byId("bulk-delete-confirm").disabled = !state.bulkDeleteProjectIds.length
          || !byId("bulk-delete-confirmation").checked;
      }

      async function bulkDeleteProjects() {
        const projectIds = [...state.bulkDeleteProjectIds];
        if (!projectIds.length || !byId("bulk-delete-confirmation").checked) {
          updateBulkDeleteConfirmState();
          return;
        }
        const confirm = byId("bulk-delete-confirm");
        confirm.disabled = true;
        try {
          const result = await request("/projects/bulk-delete", {
            method: "POST",
            body: JSON.stringify({ project_ids: projectIds }),
          });
          closeBulkDeleteDialog();
          projectIds.forEach((projectId) => state.selectedProjectIds.delete(projectId));
          if (projectIds.includes(state.selectedProjectId)) {
            state.selectedProjectId = "";
            state.selectedNodeId = "";
            state.view = null;
            state.events = [];
            state.eventCursor = 0;
          }
          const queued = (result.accepted || []).length + (result.already_deleting || []).length;
          const missing = (result.not_found || []).length;
          showToast(`已提交 ${queued} 个项目清理${missing ? `，${missing} 个项目已不存在` : ""}`);
          await refresh(true);
        } catch (error) {
          showToast(`批量删除失败: ${error.message}`, true);
        } finally {
          if (!byId("bulk-delete-dialog-layer").classList.contains("hidden")) updateBulkDeleteConfirmState();
        }
      }

      function benchmarkStatusClass(challenge) {
        const solved = Boolean(challenge.is_completed || challenge.hasSolved);
        if (solved) return "completed";
        if (challenge.project_status === "running" || challenge.container_status === "available") return "running";
        if (challenge.project_status === "starting" || challenge.container_status === "pending" || challenge.container_status === "stop_pending") return "pending";
        if (challenge.endpoints?.length) return "running";
        if (challenge.project_status === "completed") return "completed";
        return "stopped";
      }

      function benchmarkPresentationKey(settings, challenges) {
        const automation = settings?.automation || {};
        return JSON.stringify({
          mode: state.benchmarkMode,
          configured: Boolean(settings?.configured),
          base_url: settings?.base_url || "",
          task_key: settings?.task_key || "",
          automation: {
            enabled: Boolean(automation.enabled),
            status: automation.status || "",
            active_count: automation.active_count || 0,
            parallelism: automation.parallelism || 0,
            completed_count: automation.completed_count || 0,
            total_count: automation.total_count || 0,
            queued_count: automation.queued_count || 0,
            last_error: automation.last_error || "",
          },
          challenges: (challenges || []).map((challenge) => ({
            unique_code: challenge.unique_code || challenge.id || "",
            name: challenge.name || "",
            category_name: challenge.category_name || "",
            description: challenge.description || "",
            difficulty: challenge.difficulty || "",
            level: challenge.level ?? null,
            total_score: challenge.total_score ?? null,
            correct_flag_count: challenge.correct_flag_count || 0,
            flag_count: challenge.flag_count || 0,
            container_status: challenge.container_status || "stopped",
            container_addr: Array.isArray(challenge.container_addr) ? challenge.container_addr : [],
            project_id: challenge.project_id || "",
            project_status: challenge.project_status || "",
            hasSolved: Boolean(challenge.hasSolved),
            endpoints: Array.isArray(challenge.endpoints) ? challenge.endpoints : [],
            is_completed: Boolean(challenge.is_completed),
          })),
        });
      }

      function captureBenchmarkUiState(list) {
        const body = list.closest(".dialog-body");
        const drafts = {};
        let focusedCode = "";
        let selectionStart = null;
        let selectionEnd = null;
        list.querySelectorAll("input[data-benchmark-code]").forEach((input) => {
          const code = input.dataset.benchmarkCode || "";
          drafts[code] = input.value;
          if (document.activeElement === input) {
            focusedCode = code;
            selectionStart = input.selectionStart;
            selectionEnd = input.selectionEnd;
          }
        });
        return {
          drafts,
          focusedCode,
          selectionStart,
          selectionEnd,
          scrollTop: body?.scrollTop || 0,
        };
      }

      function restoreBenchmarkUiState(list, uiState) {
        const inputs = Array.from(list.querySelectorAll("input[data-benchmark-code]"));
        inputs.forEach((input) => {
          const code = input.dataset.benchmarkCode || "";
          if (Object.prototype.hasOwnProperty.call(uiState.drafts, code)) {
            input.value = uiState.drafts[code];
          }
        });
        if (uiState.focusedCode) {
          const focusedInput = inputs.find((input) => input.dataset.benchmarkCode === uiState.focusedCode);
          if (focusedInput) {
            focusedInput.focus({ preventScroll: true });
            if (Number.isInteger(uiState.selectionStart) && Number.isInteger(uiState.selectionEnd)) {
              focusedInput.setSelectionRange(uiState.selectionStart, uiState.selectionEnd);
            }
          }
        }
        const body = list.closest(".dialog-body");
        if (body) body.scrollTop = uiState.scrollTop;
      }

      function renderBenchmarkChallenges() {
        const list = byId("benchmark-list");
        const uiState = captureBenchmarkUiState(list);
        list.replaceChildren();
        const settings = state.benchmarkStatus || {};
        const agentMode = state.benchmarkMode === "agent-match";
        const automation = settings.automation || {};
        const automationLine = byId("benchmark-automation-line");
        const automationRunning = Boolean(automation.enabled);
        byId("benchmark-automation-start").classList.toggle("hidden", agentMode || automationRunning);
        byId("benchmark-automation-stop").classList.toggle("hidden", agentMode || !automationRunning);
        byId("benchmark-automation-start").disabled = state.benchmarkLoading || !settings.configured;
        byId("benchmark-automation-stop").disabled = state.benchmarkLoading;
        automationLine.classList.toggle("error", Boolean(state.benchmarkError) || ["error", "degraded"].includes(automation.status));
        if (agentMode) {
          automationLine.textContent = "赛事平台已连接 · 可启动题目环境";
        } else if (automation.status === "completed") {
          automationLine.textContent = `全部完成 · ${automation.completed_count || 0}/${automation.total_count || 0}`;
        } else if (automationRunning) {
          automationLine.textContent = `自动运行 · 实例 ${automation.active_count || 0}/${automation.parallelism || 3} · 完成 ${automation.completed_count || 0}/${automation.total_count || 0} · 排队 ${automation.queued_count || 0}${automation.last_error ? ` · ${automation.last_error}` : ""}`;
        } else {
          automationLine.textContent = automation.last_error ? `自动化已停止 · ${automation.last_error}` : "自动化未启动";
        }
        byId("benchmark-status-line").textContent = state.benchmarkActionError
          ? `操作失败 · ${state.benchmarkActionError}`
          : state.benchmarkError
            ? `更新失败，保留上次数据 · ${state.benchmarkError}`
          : settings.configured
            ? (agentMode
              ? `已连接赛事平台 ${settings.base_url}`
              : `已连接 ${settings.base_url} · Task ${settings.task_key}`)
            : "尚未配置赛事平台或评测平台";
        if (state.benchmarkLoading && state.benchmarkStatus === null) {
          list.append(element("div", "benchmark-empty", "正在读取题目与平台进度…"));
          return;
        }
        if (!settings.configured) {
          list.append(element(
            "div",
            "notice",
            state.benchmarkError
              ? "平台暂时读取失败，稍后会自动重试。"
              : "请在项目 .env 中填写赛事平台的 AGENT_MATCH_BASE_URL 和 AGENT_MATCH_ACCESS_KEY，然后重启服务。",
          ));
          return;
        }
        if (!state.benchmarkChallenges.length) {
          list.append(element("div", "benchmark-empty", "当前任务没有题目"));
          return;
        }
        state.benchmarkChallenges.forEach((challenge) => {
          const challengeKey = challenge.unique_code || challenge.id;
          const solved = Boolean(challenge.is_completed || challenge.hasSolved);
          const projectId = challenge.project_id || "";
          const card = element("article", "benchmark-card");
          card.dataset.challengeCode = challengeKey || "";
          const header = element("div", "benchmark-card-header");
          const copy = element("div");
          copy.append(
            element("h3", "benchmark-code", challenge.name || challenge.unique_code || `题目 ${challenge.id || ""}` || "未命名题目"),
            element("p", "benchmark-description", challenge.description || (challenge.category_name ? `分类：${challenge.category_name}` : "平台未提供题目描述")),
          );
          const chip = element("span");
          setStatusChip(chip, benchmarkStatusClass(challenge));
          header.append(copy, chip);

          const meta = element("div", "benchmark-meta");
          const metaValues = [
            ["分类", challenge.category_name || "-"],
            ["难度", challenge.difficulty || challenge.level || "-"],
            ["关卡", challenge.level ?? "-"],
            ["分值", challenge.total_score ?? challenge.score ?? "-"],
            ["状态", challenge.project_status || (solved ? "已解决" : challenge.container_status || "未启动")],
          ];
          metaValues.forEach(([label, value]) => {
            const item = element("span");
            item.append(element("strong", "", `${label} `), document.createTextNode(String(value)));
            meta.append(item);
          });
          card.append(header, meta);
          const addresses = Array.isArray(challenge.container_addr) ? challenge.container_addr : [];
          if (!addresses.length && Array.isArray(challenge.endpoints)) {
            challenge.endpoints.forEach((endpoint) => {
              const proxies = Array.isArray(endpoint.proxyIps) ? endpoint.proxyIps : [];
              const mappings = Array.isArray(endpoint.portMappings) ? endpoint.portMappings : [];
              proxies.forEach((host) => mappings.forEach((mapping) => addresses.push(`${host}:${mapping.proxy || mapping.port || ""}`)));
            });
          }
          if (addresses.length) {
            card.append(element("div", "benchmark-address", addresses.join(" · ")));
          }

          const actions = element("div", "benchmark-actions");
          const start = element("button", "button primary", projectId ? "重启 / 同步实例" : "启动并创建项目");
          start.type = "button";
          start.disabled = solved;
          start.addEventListener("click", () => benchmarkStart(challengeKey, start));
          actions.append(start);
          if (projectId) {
            const open = element("button", "button", "打开项目");
            open.type = "button";
            open.addEventListener("click", async () => {
              closeBenchmarkDialog();
              await selectProject(projectId);
            });
            actions.append(open);
          }
          if (!agentMode) {
            const hint = element("button", "button warning", "获取 Hint（扣分）");
            hint.type = "button";
            hint.disabled = solved;
            hint.addEventListener("click", () => benchmarkHint(challengeKey, hint));
            actions.append(hint);
          }
          if (agentMode ? (projectId && !solved) : ["available", "pending", "stop_pending"].includes(challenge.container_status)) {
            const close = element("button", "button critical", "关闭实例");
            close.type = "button";
            close.addEventListener("click", () => benchmarkClose(challengeKey, close));
            actions.append(close);
          }
          if (projectId && !solved) {
            const form = element("div", "benchmark-submit");
            const input = element("input", "dialog-input");
            input.type = "text";
            input.placeholder = agentMode ? "手动提交候选 Flag" : "手动提交候选 Flag（AI 也会自动提交）";
            input.setAttribute("aria-label", `${challengeKey} 候选 Flag`);
            input.dataset.benchmarkCode = challengeKey || "";
            const submit = element("button", "button primary", "提交");
            submit.type = "button";
            const run = () => benchmarkSubmit(challengeKey, input, submit);
            submit.addEventListener("click", run);
            input.addEventListener("keydown", (event) => { if (event.key === "Enter") run(); });
            form.append(input, submit);
            actions.append(form);
          }
          card.append(actions);
          list.append(card);
        });
        restoreBenchmarkUiState(list, uiState);
      }

      async function loadBenchmarkChallenges(options = {}) {
        if (state.benchmarkLoading) return;
        const firstLoad = state.benchmarkStatus === null;
        const forceRender = Boolean(options.force);
        state.benchmarkLoading = true;
        if (firstLoad && options.showLoading) renderBenchmarkChallenges();
        let shouldRender = firstLoad || forceRender;
        try {
          let nextStatus;
          let nextChallenges;
          let nextMode;
          try {
            const agentStatus = await request("/agent-match/status");
            if (agentStatus.configured) {
              nextMode = "agent-match";
              nextStatus = agentStatus;
              nextChallenges = (await request("/agent-match/exercises")).exercises || [];
            } else {
              throw new Error("agent_match_not_configured");
            }
          } catch (agentError) {
            nextMode = "benchmark";
            nextStatus = await request("/benchmark/status");
            nextChallenges = nextStatus.configured
              ? ((await request("/benchmark/challenges")).challenges || [])
              : [];
          }
          const nextKey = benchmarkPresentationKey(nextStatus, nextChallenges);
          shouldRender = shouldRender || nextKey !== state.benchmarkRenderKey || Boolean(state.benchmarkError);
          state.benchmarkMode = nextMode;
          state.benchmarkStatus = nextStatus;
          state.benchmarkChallenges = nextChallenges;
          state.benchmarkRenderKey = nextKey;
          state.benchmarkError = "";
        } catch (error) {
          const message = String(error.message || error);
          const errorChanged = message !== state.benchmarkError;
          state.benchmarkError = message;
          shouldRender = shouldRender || errorChanged;
          if (errorChanged) showToast(`评测平台读取失败: ${message}`, true);
        } finally {
          state.benchmarkLoading = false;
          if (shouldRender) renderBenchmarkChallenges();
        }
      }

      function openBenchmarkDialog() {
        byId("benchmark-dialog-layer").classList.remove("hidden");
        loadBenchmarkChallenges({ showLoading: true });
        if (state.benchmarkPollTimer === null) {
          state.benchmarkPollTimer = window.setInterval(() => loadBenchmarkChallenges(), 3000);
        }
      }

      function closeBenchmarkDialog() {
        byId("benchmark-dialog-layer").classList.add("hidden");
        if (state.benchmarkPollTimer !== null) {
          window.clearInterval(state.benchmarkPollTimer);
          state.benchmarkPollTimer = null;
        }
      }

      async function benchmarkAutomationStart() {
        const button = byId("benchmark-automation-start");
        button.disabled = true;
        try {
          await request("/benchmark/automation/start", {
            method: "POST",
            body: JSON.stringify({ parallelism: 3 }),
          });
          showToast("自动化已启动，正在开启前三个未完成题目");
          await loadBenchmarkChallenges();
          await refresh(true);
        } catch (error) {
          showToast(`启动自动化失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      async function benchmarkAutomationStop() {
        const button = byId("benchmark-automation-stop");
        button.disabled = true;
        try {
          await request("/benchmark/automation/stop", { method: "POST" });
          showToast("自动化已停止，当前题目保持现状");
          await loadBenchmarkChallenges();
        } catch (error) {
          showToast(`停止自动化失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      async function benchmarkStart(uniqueCode, button) {
        const originalLabel = button.textContent;
        button.disabled = true;
        button.textContent = "正在启动…";
        state.benchmarkActionError = "";
        showToast(`题目 ${uniqueCode} 正在启动，等待平台返回环境…`);
        try {
          const path = state.benchmarkMode === "agent-match"
            ? `/agent-match/exercises/${encodeURIComponent(uniqueCode)}/start`
            : `/benchmark/challenges/${encodeURIComponent(uniqueCode)}/start`;
          const result = await request(path, { method: "POST" });
          state.selectedProjectId = result.project?.id || state.selectedProjectId;
          showToast(`题目 ${uniqueCode} 已启动，Reason 将生成并行探索分支`);
          state.benchmarkActionError = "";
          await loadBenchmarkChallenges();
          await refresh(true);
        } catch (error) {
          const raw = String(error.message || error);
          const message = raw.includes("429") || /rate.?limit|too many/i.test(raw)
            ? "平台正在限流或已有启动请求，请等待当前环境状态刷新后再操作。"
            : raw.includes("504") || /timeout|timed out|did not become ready/i.test(raw)
              ? "平台在等待时间内没有返回可用环境；附件题无需靶机时可直接继续，网络题请稍后重试。"
              : raw;
          state.benchmarkActionError = message;
          showToast(`启动题目失败: ${message}`, true);
          await loadBenchmarkChallenges({ force: true });
        } finally {
          if (button.isConnected) {
            button.disabled = false;
            button.textContent = originalLabel;
          }
        }
      }

      async function benchmarkHint(uniqueCode, button) {
        if (!window.confirm("查看平台 Hint 会扣减该题得分，确认继续？")) return;
        button.disabled = true;
        try {
          const result = await request(`/benchmark/challenges/${encodeURIComponent(uniqueCode)}/hint`, {
            method: "POST",
            body: JSON.stringify({ confirm_score_penalty: true }),
          });
          showToast(result.hint ? `Hint: ${result.hint}` : "平台没有提供 Hint");
          await refresh(true);
        } catch (error) {
          showToast(`获取 Hint 失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      async function benchmarkSubmit(uniqueCode, input, button) {
        const flag = input.value.trim();
        if (!flag) return;
        button.disabled = true;
        state.benchmarkActionError = "";
        try {
          const path = state.benchmarkMode === "agent-match"
            ? `/agent-match/exercises/${encodeURIComponent(uniqueCode)}/submit`
            : `/benchmark/challenges/${encodeURIComponent(uniqueCode)}/submit`;
          const result = await request(path, {
            method: "POST",
            body: JSON.stringify({ flag }),
          });
          const outcome = result.outcomes?.[0] || {};
          input.value = "";
          showToast(outcome.correct ? "平台验证正确" : "平台判定错误，已写入黑板避免重复");
          await loadBenchmarkChallenges();
          await refresh(true);
        } catch (error) {
          state.benchmarkActionError = String(error.message || error);
          showToast(`提交失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      async function benchmarkClose(uniqueCode, button) {
        button.disabled = true;
        state.benchmarkActionError = "";
        try {
          const path = state.benchmarkMode === "agent-match"
            ? `/agent-match/exercises/${encodeURIComponent(uniqueCode)}/recover`
            : `/benchmark/challenges/${encodeURIComponent(uniqueCode)}/close`;
          await request(path, { method: "POST" });
          showToast(`题目 ${uniqueCode} 实例已关闭`);
          await loadBenchmarkChallenges();
          await refresh(true);
        } catch (error) {
          state.benchmarkActionError = String(error.message || error);
          showToast(`关闭实例失败: ${error.message}`, true);
        } finally {
          if (button.isConnected) button.disabled = false;
        }
      }

      byId("refresh-button").addEventListener("click", () => refresh(false));
      byId("benchmark-button").addEventListener("click", openBenchmarkDialog);
      byId("benchmark-automation-start").addEventListener("click", benchmarkAutomationStart);
      byId("benchmark-automation-stop").addEventListener("click", benchmarkAutomationStop);
      byId("benchmark-refresh").addEventListener("click", () => loadBenchmarkChallenges({ force: true }));
      byId("benchmark-close-dialog").addEventListener("click", closeBenchmarkDialog);
      byId("results-view-button").addEventListener("click", () => setViewMode("results"));
      byId("graph-view-button").addEventListener("click", () => setViewMode("graph"));
      byId("new-project-button").addEventListener("click", openNewProjectDialog);
      byId("project-select-all").addEventListener("change", (event) => {
        if (event.target.checked) state.projects.forEach((project) => state.selectedProjectIds.add(project.id));
        else state.selectedProjectIds.clear();
        renderProjectList();
      });
      byId("bulk-delete-button").addEventListener("click", openBulkDeleteDialog);
      byId("bulk-delete-cancel").addEventListener("click", closeBulkDeleteDialog);
      byId("bulk-delete-confirm").addEventListener("click", bulkDeleteProjects);
      byId("bulk-delete-confirmation").addEventListener("change", updateBulkDeleteConfirmState);
      byId("new-project-cancel").addEventListener("click", closeNewProjectDialog);
      byId("new-project-confirm").addEventListener("click", createNewProject);
      byId("new-project-add-hint").addEventListener("click", () => {
        if (!state.creatingProject) addNewProjectHint();
      });
      byId("new-project-name").addEventListener("input", updateNewProjectConfirmState);
      byId("new-project-target").addEventListener("input", updateNewProjectConfirmState);
      byId("new-project-goal").addEventListener("input", updateNewProjectConfirmState);
      byId("hint-button").addEventListener("click", openHintDialog);
      byId("stop-button").addEventListener("click", () => setProjectStatus("stopped"));
      byId("resume-button").addEventListener("click", () => setProjectStatus("running"));
      byId("reopen-button").addEventListener("click", openReopenDialog);
      byId("delete-button").addEventListener("click", openDeleteDialog);
      byId("reopen-cancel").addEventListener("click", closeReopenDialog);
      byId("reopen-confirm").addEventListener("click", reopenProject);
      byId("reopen-description").addEventListener("input", updateReopenConfirmState);
      byId("hint-cancel").addEventListener("click", closeHintDialog);
      byId("hint-confirm").addEventListener("click", addHint);
      byId("hint-content").addEventListener("input", updateHintConfirmState);
      byId("delete-cancel").addEventListener("click", closeDeleteDialog);
      byId("delete-confirm").addEventListener("click", deleteProject);
      byId("delete-project-confirmation").addEventListener("input", updateDeleteConfirmState);
      byId("reopen-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("reopen-dialog-layer")) closeReopenDialog(); });
      byId("hint-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("hint-dialog-layer")) closeHintDialog(); });
      byId("delete-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("delete-dialog-layer")) closeDeleteDialog(); });
      byId("bulk-delete-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("bulk-delete-dialog-layer")) closeBulkDeleteDialog(); });
      byId("new-project-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("new-project-dialog-layer")) closeNewProjectDialog(); });
      byId("benchmark-dialog-layer").addEventListener("click", (event) => { if (event.target === byId("benchmark-dialog-layer")) closeBenchmarkDialog(); });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") { closeNewProjectDialog(); closeReopenDialog(); closeHintDialog(); closeDeleteDialog(); closeBulkDeleteDialog(); closeBenchmarkDialog(); } });
      window.setInterval(() => refresh(false), 5000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(false); });
      refresh(true);
    })();
  </script>
</body>
</html>
