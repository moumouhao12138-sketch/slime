name: Roll back accidental image publication

on:
  push:
    branches:
      - cairn-runtime

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the previous latest app image
        run: |
          docker pull ghcr.io/moumouhao12138-sketch/slime:0.0.41
          docker tag ghcr.io/moumouhao12138-sketch/slime:0.0.41 ghcr.io/moumouhao12138-sketch/slime:latest
          docker push ghcr.io/moumouhao12138-sketch/slime:latest

      - name: Delete the accidental 0.0.42 package version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE /user/packages/container/slime/versions/1155458612
