name: Restore pre-release image state

on:
  push:
    branches:
      - cairn-runtime

permissions:
  contents: read
  packages: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the exact previous latest manifest
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/moumouhao12138-sketch/slime:latest \
            ghcr.io/moumouhao12138-sketch/slime:0.0.41

      - name: Remove temporary package versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /user/packages/container/slime/versions?per_page=100 > /tmp/versions.json
          python3 - <<'PY' > /tmp/delete-ids
          import json
          versions = json.load(open('/tmp/versions.json'))
          bad_digest = 'sha256:4f7e283c65951240661cf7fe81c9fe75d10bed133e8a4787cc85fc90a10261c7'
          for version in versions:
              metadata = version.get('metadata', {}).get('container', {})
              tags = metadata.get('tags', [])
              blob = json.dumps(version)
              if '0.0.42' in tags or bad_digest in blob:
                  print(version['id'])
          PY
          while read -r id; do
            [ -n "$id" ] && gh api --method DELETE "/user/packages/container/slime/versions/$id"
          done < /tmp/delete-ids
