name: Publish container images

on:
  push:
    tags:
      - "v*"
      - "slime.v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Container image tag
        required: true
        default: "0.0.39"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/slime.v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${GITHUB_REF_NAME/slime./slime-}"
          notes="docs/releases/${title}.md"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes"

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: slime
            context: .
            dockerfile: ./Dockerfile
          - name: worker
            image: slime-worker
            context: ./worker
            dockerfile: ./worker/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/slime.v* ]]; then
            echo "value=0.${GITHUB_REF_NAME#slime.v}" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moumouhao12138-sketch/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
